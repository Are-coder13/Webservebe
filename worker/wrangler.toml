name = "designerprospector"
main = "worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# The Anthropic API key is NOT stored here. Set it as an encrypted secret:
# npx wrangler secret put ANTHROPIC_API_KEY

browser = { binding = "BROWSER" }

# Async runner configuration
# SHARED_SECRET must match the secret configured on Railway.

[vars]
RUNNER_URL = "https://webservebe-production.up.railway.app"
